name: Pruebas de la aplicación
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install flask==3.0.3 waitress==3.0.2
      - run: python -m unittest studio.test_studio -v
      - run: bash -n instalar.command iniciar.command
